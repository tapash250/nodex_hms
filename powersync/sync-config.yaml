      - |
        select clinical_threads.* from clinical_threads
        join bucket_clinical_messaging scope on scope.tenant_id = clinical_threads.tenant_id
         where clinical_threads.tenant_id = scope.tenant_id and auth.user_id() IN clinical_threads.participants
      - |
        select clinical_messages.* from clinical_messages
        join bucket_clinical_messaging scope on scope.tenant_id = clinical_messages.tenant_id
         join clinical_threads t on t.id = clinical_messages.thread_id where t.tenant_id = scope.tenant_id and auth.user_id() IN t.participants
      - |
        select clinical_attachments.* from clinical_attachments
        join bucket_clinical_messaging scope on scope.tenant_id = clinical_attachments.tenant_id
         join clinical_messages m on m.id = clinical_attachments.message_id join clinical_threads t on t.id = m.thread_id where t.tenant_id = scope.tenant_id and auth.user_id() IN t.participants

