# NODEX Enterprise HMS — PowerSync Sync Streams.
#
# This is the full-coverage configuration. It keeps the reviewed
# identity/patient/ward streams and adds every table in the local schema that
# the legacy rules described but the earlier 18-table deployment omitted.
#
# Every parameter derives from the verified Supabase JWT (auth.user_id()).
# The client cannot request another user's scope.
#
# Known limitation: Sync Streams cannot evaluate time-based expressions, so
# memberships.valid_until is not checked here. Expiry is a WAL event:
# nodex.expire_memberships() runs every minute and flips status to 'expired',
# and every scope query joins status = 'active'. The mutation trigger and RLS
# helpers still check valid_until at the exact instant.
#
# Local-only tables (local_mutation_log, local_diagnostics, scratchpads) are
# deliberately never replicated.

config:
  edition: 3

with:
  # Active memberships, used for tenant master data.
  my_tenants: |
    SELECT tenant_id
    FROM memberships
    WHERE user_id = auth.user_id()
      AND status = 'active'

  # Active memberships whose role grants patient.read. Mirrors the RLS gate on
  # public.patients, public.beds and public.bed_assignments.
  my_patient_tenants: |
    SELECT m.tenant_id
    FROM memberships m
    JOIN role_permissions rp ON rp.role_key = m.role_key
    WHERE m.user_id = auth.user_id()
      AND m.status = 'active'
      AND rp.permission_key = 'patient.read'

  # Active memberships whose role grants encounter.read. Mirrors the RLS gate on
  # public.clinical_encounters, public.patient_allergies,
  # public.clinical_problems and public.encounter_amendments.
  my_encounter_tenants: |
    SELECT m.tenant_id
    FROM memberships m
    JOIN role_permissions rp ON rp.role_key = m.role_key
    WHERE m.user_id = auth.user_id()
      AND m.status = 'active'
      AND rp.permission_key = 'encounter.read'

  # Patients explicitly assigned to the caller. The tenant is part of the
  # result: an assignment row in another tenant must not grant scope over a
  # patient in this one.
  my_assigned_patient_ids: |
    SELECT da.tenant_id, da.patient_id
    FROM doctor_assignments da
    JOIN patients p
      ON p.id = da.patient_id
     AND p.tenant_id = da.tenant_id
    JOIN memberships m
      ON m.tenant_id = da.tenant_id
     AND m.user_id = auth.user_id()
     AND m.status = 'active'
    WHERE da.doctor_id = auth.user_id()
      AND da.status = 'active'

  # Patients with an active encounter where the caller is the attending or the
  # creator. Mirrors the trigger's encounter branch, so a clinician can finish
  # an encounter that was opened before a dashboard assignment existed.
  my_encounter_patient_ids: |
    SELECT e.tenant_id, e.patient_id
    FROM clinical_encounters e
    JOIN patients p
      ON p.id = e.patient_id
     AND p.tenant_id = e.tenant_id
    JOIN memberships m
      ON m.tenant_id = e.tenant_id
     AND m.user_id = auth.user_id()
     AND m.status = 'active'
    WHERE (e.attending_physician_id = auth.user_id() OR e.created_by = auth.user_id())
      AND (e.status = 'planned' OR e.status = 'in_progress')

  # Patients currently occupying a bed in a ward the caller covers. A null
  # facility_id or ward_id on the membership means facility-wide or
  # tenant-wide coverage, matching nodex.has_facility_access.
  my_ward_patient_ids: |
    SELECT ba.tenant_id, ba.patient_id
    FROM bed_assignments ba
    JOIN patients p
      ON p.id = ba.patient_id
     AND p.tenant_id = ba.tenant_id
    JOIN beds b ON b.id = ba.bed_id
    JOIN wards w ON w.id = b.ward_id
    JOIN memberships m ON m.tenant_id = ba.tenant_id
    JOIN role_permissions rp ON rp.role_key = m.role_key
    WHERE ba.status = 'active'
      AND b.tenant_id = ba.tenant_id
      AND w.tenant_id = ba.tenant_id
      AND m.user_id = auth.user_id()
      AND m.status = 'active'
      AND rp.permission_key = 'patient.read'
      AND (m.facility_id IS NULL OR m.facility_id = w.facility_id)
      AND (m.ward_id IS NULL OR m.ward_id = b.ward_id)

  # Portal links for the signed-in patient account.
  my_portal_links: |
    SELECT l.patient_id, l.tenant_id
    FROM patient_portal_links l
    JOIN memberships m ON m.tenant_id = l.tenant_id
    JOIN role_permissions rp ON rp.role_key = m.role_key
    WHERE l.portal_user_id = auth.user_id()
      AND l.revoked_at IS NULL
      AND m.user_id = auth.user_id()
      AND m.status = 'active'
      AND rp.permission_key = 'portal.access'

  bucket_lab_workflows: |
    select m.tenant_id as tenant_id from memberships m join role_permissions rp on rp.role_key = m.role_key where m.user_id = auth.user_id() and m.role_key <> 'patient' and m.status = 'active' and rp.permission_key = 'patient.read'

  bucket_rx_pharmacy: |
    select m.tenant_id as tenant_id from memberships m join role_permissions rp on rp.role_key = m.role_key where m.user_id = auth.user_id() and m.role_key <> 'patient' and m.status = 'active' and rp.permission_key = 'patient.read'

  bucket_appt_schedule: |
