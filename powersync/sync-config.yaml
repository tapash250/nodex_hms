streams:
  # The caller's own identity, memberships, enrolled device and per-stream sync
  # health. RLS equivalent: app_users_select_self, memberships_select_self,
  # devices_select_own, sync_cursors_select_own.
  identity:
    auto_subscribe: true
    queries:
      - SELECT * FROM app_users WHERE id = auth.user_id()
      - SELECT * FROM memberships WHERE user_id = auth.user_id()
      - SELECT * FROM devices WHERE assigned_user_id = auth.user_id()
      - |
        SELECT * FROM sync_cursors
        WHERE device_id IN (
          SELECT id FROM devices WHERE assigned_user_id = auth.user_id()
        )

  # Tenant master data for every tenant the caller is an active member of.
  # Facilities, departments and wards also honour the membership's facility
  # scope, mirroring nodex.has_facility_access: a null facility_id is
  # tenant-wide, a non-null facility_id covers only that facility.
  tenant_master:
    auto_subscribe: true
    queries:
      - SELECT * FROM tenants WHERE id IN (SELECT tenant_id FROM my_tenants)
      - |
        SELECT facilities.* FROM facilities
        JOIN memberships m ON m.tenant_id = facilities.tenant_id
        WHERE m.user_id = auth.user_id()
          AND m.status = 'active'
          AND (m.facility_id IS NULL OR m.facility_id = facilities.id)
      - |
        SELECT departments.* FROM departments
        JOIN memberships m ON m.tenant_id = departments.tenant_id
        WHERE m.user_id = auth.user_id()
          AND m.status = 'active'
          AND (m.facility_id IS NULL OR m.facility_id = departments.facility_id)
      - |
        SELECT wards.* FROM wards
        JOIN memberships m ON m.tenant_id = wards.tenant_id
        WHERE m.user_id = auth.user_id()
          AND m.status = 'active'
          AND (m.facility_id IS NULL OR m.facility_id = wards.facility_id)

  # Assignment-scoped patient projection. A patient is synced only when the
  # caller is the active attending/consulting doctor, has an active encounter,
  # or the patient is in a bed the caller's ward/facility membership covers.
  patients:
    auto_subscribe: true
    queries:
      - |
        SELECT patients.* FROM patients
        JOIN my_patient_tenants pt ON pt.tenant_id = patients.tenant_id
        JOIN my_assigned_patient_ids a
          ON a.tenant_id = patients.tenant_id
         AND a.patient_id = patients.id
      - |
        SELECT patients.* FROM patients
        JOIN my_patient_tenants pt ON pt.tenant_id = patients.tenant_id
        JOIN my_encounter_patient_ids e
          ON e.tenant_id = patients.tenant_id
         AND e.patient_id = patients.id
      - |
        SELECT patients.* FROM patients
        JOIN my_patient_tenants pt ON pt.tenant_id = patients.tenant_id
        JOIN my_ward_patient_ids w
          ON w.tenant_id = patients.tenant_id
         AND w.patient_id = patients.id
      - |
        SELECT patient_merge_history.* from patient_merge_history
        JOIN my_patient_tenants pt ON pt.tenant_id = patient_merge_history.tenant_id

  # Clinical records for the patients in scope, gated by encounter.read. Each
  # table has one query per scope branch for the same composite-tenant reason.
  patient_clinical:
    auto_subscribe: true
    queries:
      - |
        SELECT patient_allergies.* FROM patient_allergies
        JOIN my_encounter_tenants et ON et.tenant_id = patient_allergies.tenant_id
        JOIN my_assigned_patient_ids a
          ON a.tenant_id = patient_allergies.tenant_id
         AND a.patient_id = patient_allergies.patient_id
      - |
        SELECT patient_allergies.* FROM patient_allergies
        JOIN my_encounter_tenants et ON et.tenant_id = patient_allergies.tenant_id
        JOIN my_encounter_patient_ids e
          ON e.tenant_id = patient_allergies.tenant_id
         AND e.patient_id = patient_allergies.patient_id
      - |
        SELECT patient_allergies.* FROM patient_allergies
        JOIN my_encounter_tenants et ON et.tenant_id = patient_allergies.tenant_id
        JOIN my_ward_patient_ids w
          ON w.tenant_id = patient_allergies.tenant_id
         AND w.patient_id = patient_allergies.patient_id
      - |
        SELECT clinical_encounters.* FROM clinical_encounters
        JOIN my_encounter_tenants et ON et.tenant_id = clinical_encounters.tenant_id
        JOIN my_assigned_patient_ids a
          ON a.tenant_id = clinical_encounters.tenant_id
         AND a.patient_id = clinical_encounters.patient_id
      - |
        SELECT clinical_encounters.* FROM clinical_encounters
        JOIN my_encounter_tenants et ON et.tenant_id = clinical_encounters.tenant_id
        JOIN my_encounter_patient_ids e
          ON e.tenant_id = clinical_encounters.tenant_id
         AND e.patient_id = clinical_encounters.patient_id
      - |
        SELECT clinical_encounters.* FROM clinical_encounters
        JOIN my_encounter_tenants et ON et.tenant_id = clinical_encounters.tenant_id
        JOIN my_ward_patient_ids w
          ON w.tenant_id = clinical_encounters.tenant_id
         AND w.patient_id = clinical_encounters.patient_id
      - |
        SELECT clinical_problems.* FROM clinical_problems
        JOIN my_encounter_tenants et ON et.tenant_id = clinical_problems.tenant_id
        JOIN my_assigned_patient_ids a
          ON a.tenant_id = clinical_problems.tenant_id
         AND a.patient_id = clinical_problems.patient_id
      - |
        SELECT clinical_problems.* FROM clinical_problems
        JOIN my_encounter_tenants et ON et.tenant_id = clinical_problems.tenant_id
        JOIN my_encounter_patient_ids e
          ON e.tenant_id = clinical_problems.tenant_id
         AND e.patient_id = clinical_problems.patient_id
      - |
        SELECT clinical_problems.* FROM clinical_problems
        JOIN my_encounter_tenants et ON et.tenant_id = clinical_problems.tenant_id
        JOIN my_ward_patient_ids w
          ON w.tenant_id = clinical_problems.tenant_id
         AND w.patient_id = clinical_problems.patient_id
      - |
        SELECT encounter_amendments.* FROM encounter_amendments
        JOIN clinical_encounters ce
          ON ce.id = encounter_amendments.encounter_id
         AND ce.tenant_id = encounter_amendments.tenant_id
        JOIN my_encounter_tenants et ON et.tenant_id = encounter_amendments.tenant_id
        JOIN my_assigned_patient_ids a
          ON a.tenant_id = encounter_amendments.tenant_id
         AND a.patient_id = ce.patient_id
      - |
        SELECT encounter_amendments.* FROM encounter_amendments
        JOIN clinical_encounters ce
          ON ce.id = encounter_amendments.encounter_id
         AND ce.tenant_id = encounter_amendments.tenant_id
        JOIN my_encounter_tenants et ON et.tenant_id = encounter_amendments.tenant_id
        JOIN my_encounter_patient_ids e
          ON e.tenant_id = encounter_amendments.tenant_id
         AND e.patient_id = ce.patient_id
      - |
        SELECT encounter_amendments.* FROM encounter_amendments
        JOIN clinical_encounters ce
          ON ce.id = encounter_amendments.encounter_id
         AND ce.tenant_id = encounter_amendments.tenant_id
        JOIN my_encounter_tenants et ON et.tenant_id = encounter_amendments.tenant_id
        JOIN my_ward_patient_ids w
          ON w.tenant_id = encounter_amendments.tenant_id
         AND w.patient_id = ce.patient_id
      - |
        SELECT discharges.* from discharges
        JOIN my_patient_tenants pt ON pt.tenant_id = discharges.tenant_id
        JOIN my_assigned_patient_ids a
          ON a.tenant_id = discharges.tenant_id
         AND a.patient_id = discharges.patient_id
      - |
        SELECT discharges.* from discharges
        JOIN my_patient_tenants pt ON pt.tenant_id = discharges.tenant_id
        JOIN my_encounter_patient_ids e
          ON e.tenant_id = discharges.tenant_id
         AND e.patient_id = discharges.patient_id
      - |
        SELECT discharges.* from discharges
        JOIN my_patient_tenants pt ON pt.tenant_id = discharges.tenant_id
        JOIN my_ward_patient_ids w
          ON w.tenant_id = discharges.tenant_id
         AND w.patient_id = discharges.patient_id
      - |
        SELECT encounter_scribe_drafts.* from encounter_scribe_drafts
        JOIN clinical_encounters ce
          ON ce.id = encounter_scribe_drafts.encounter_id
         AND ce.tenant_id = encounter_scribe_drafts.tenant_id
        JOIN my_encounter_tenants et ON et.tenant_id = encounter_scribe_drafts.tenant_id
        JOIN my_assigned_patient_ids a
          ON a.tenant_id = encounter_scribe_drafts.tenant_id
         AND a.patient_id = ce.patient_id
      - |
        SELECT encounter_scribe_drafts.* from encounter_scribe_drafts
        JOIN clinical_encounters ce
          ON ce.id = encounter_scribe_drafts.encounter_id
         AND ce.tenant_id = encounter_scribe_drafts.tenant_id
        JOIN my_encounter_tenants et ON et.tenant_id = encounter_scribe_drafts.tenant_id
        JOIN my_encounter_patient_ids e
          ON e.tenant_id = encounter_scribe_drafts.tenant_id
         AND e.patient_id = ce.patient_id
      - |
        SELECT encounter_scribe_drafts.* from encounter_scribe_drafts
        JOIN clinical_encounters ce
          ON ce.id = encounter_scribe_drafts.encounter_id
         AND ce.tenant_id = encounter_scribe_drafts.tenant_id
        JOIN my_encounter_tenants et ON et.tenant_id = encounter_scribe_drafts.tenant_id
        JOIN my_ward_patient_ids w
          ON w.tenant_id = encounter_scribe_drafts.tenant_id
         AND w.patient_id = ce.patient_id

  # The caller's own assignment list, used by the doctor dashboard offline.
  doctor_assignments:
    auto_subscribe: true
    query: |
      SELECT doctor_assignments.* FROM doctor_assignments
      JOIN patients
        ON patients.id = doctor_assignments.patient_id
       AND patients.tenant_id = doctor_assignments.tenant_id
      WHERE doctor_assignments.doctor_id = auth.user_id()
        AND doctor_assignments.status = 'active'
        AND doctor_assignments.tenant_id IN (SELECT tenant_id FROM my_patient_tenants)

  # Role and permission catalogues. Global configuration, not tenant data.
  catalog:
    auto_subscribe: true
    queries:
      - |
        SELECT key AS id, key, display_name, description, role_class,
               is_privileged, offline_capable
        FROM roles
      - |
        SELECT key AS id, key, display_name, description, module_code,
               risk_tier, requires_online
        FROM permissions
      - |
        SELECT role_key || ':' || permission_key AS id, role_key, permission_key
        FROM role_permissions

  # Beds and occupancy for the caller's wards/facilities, gated by patient.read.
  ward_census:
    auto_subscribe: true
    queries:
      - |
        SELECT beds.* FROM beds
        JOIN wards w ON w.id = beds.ward_id
        JOIN memberships m ON m.tenant_id = beds.tenant_id
        JOIN role_permissions rp ON rp.role_key = m.role_key
        WHERE m.user_id = auth.user_id()
          AND m.status = 'active'
          AND rp.permission_key = 'patient.read'
          AND w.tenant_id = beds.tenant_id
          AND (m.facility_id IS NULL OR m.facility_id = w.facility_id)
          AND (m.ward_id IS NULL OR m.ward_id = beds.ward_id)
      - |
        SELECT bed_assignments.* FROM bed_assignments
        JOIN patients p
          ON p.id = bed_assignments.patient_id
         AND p.tenant_id = bed_assignments.tenant_id
        JOIN beds ON beds.id = bed_assignments.bed_id
        JOIN wards w ON w.id = beds.ward_id
        JOIN memberships m ON m.tenant_id = bed_assignments.tenant_id
        JOIN role_permissions rp ON rp.role_key = m.role_key
        WHERE bed_assignments.status = 'active'
          AND beds.tenant_id = bed_assignments.tenant_id
          AND w.tenant_id = bed_assignments.tenant_id
          AND m.user_id = auth.user_id()
          AND m.status = 'active'
          AND rp.permission_key = 'patient.read'
          AND (m.facility_id IS NULL OR m.facility_id = w.facility_id)
          AND (m.ward_id IS NULL OR m.ward_id = beds.ward_id)

  # AI governance configuration: registry, routing policies and deployment
  # profiles are global read-only configuration. No PHI, no credentials.
  ai_configuration:
    auto_subscribe: true
    queries:
      - SELECT * FROM ai_model_registry
      - SELECT * FROM ai_routing_policies
      - SELECT * FROM ai_deployment_profiles WHERE is_active = true

  # Audit rows the caller authored themselves. The full trail stays server-side
  # under audit.read; only the actor's own history belongs on a device.
  audit_self:
    auto_subscribe: true
    query: |
      SELECT * FROM audit_events WHERE actor_id = auth.user_id()

  # Patient portal: only rows belonging to the patient the portal account is
  # linked to. The patient role holds no clinical read permission, so this is
  # the only path to the patient's own record.
  patient_portal:
    auto_subscribe: true
    queries:
      - |
        SELECT appointments.* FROM appointments
        JOIN my_portal_links l ON l.patient_id = appointments.patient_id
      - |
        SELECT lab_orders.* FROM lab_orders
        JOIN my_portal_links l ON l.patient_id = lab_orders.patient_id
      - |
        SELECT lab_results.* FROM lab_results
        JOIN lab_orders o ON o.id = lab_results.lab_order_id
        JOIN my_portal_links l ON l.patient_id = o.patient_id
        WHERE lab_results.status = 'verified' OR lab_results.status = 'corrected'
      - |
        SELECT prescriptions.* FROM prescriptions
        JOIN my_portal_links l ON l.patient_id = prescriptions.patient_id
        WHERE prescriptions.status = 'finalized'
      - |
        SELECT prescription_items.* FROM prescription_items
        JOIN prescriptions p ON p.id = prescription_items.prescription_id
        JOIN my_portal_links l ON l.patient_id = p.patient_id
        WHERE p.status = 'finalized'
          AND prescription_items.status <> 'cancelled'
      - |
        SELECT patient_portal_links.* FROM patient_portal_links
        JOIN my_portal_links l ON l.patient_id = patient_portal_links.patient_id
        WHERE patient_portal_links.portal_user_id = auth.user_id()

