# NODEX Enterprise HMS - Gradle properties.

# Heap sized for R8 minification plus the SQLCipher and Flutter native builds.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false

# Flags added by the Flutter template.
android.newDsl=false
android.builtInKotlin=false
