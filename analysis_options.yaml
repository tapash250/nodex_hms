# NODEX Enterprise HMS - static analysis configuration.
#
# The specification defines hard engineering prohibitions (no direct Supabase
# calls from presentation code, no PHI in general-purpose logs, no unvalidated AI
# output reaching finalized records). Analysis cannot prove all of those, but it
# is configured strictly so that boundary violations and unsafe patterns surface
# as build failures rather than review comments.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Treat correctness and boundary issues as build failures.
    missing_return: error
    dead_code: error
    unused_import: error
    unused_local_variable: error
    unused_field: error
    unnecessary_import: error
    invalid_use_of_visible_for_testing_member: error
    invalid_use_of_protected_member: error
    body_might_complete_normally_nullable: error
    argument_type_not_assignable: error
    # An unawaited future in a clinical write path can silently drop a mutation.
    discarded_futures: error
    unawaited_futures: error
    # PHI must never reach a general-purpose log sink.
    avoid_print: error
    # TODO comments are permitted, but never in place of a required control.
    todo: info

  exclude:
    - build/**
    - android/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'

linter:
  rules:
    # Correctness
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

    # Immutability and value semantics for domain entities
    prefer_final_locals: true
    prefer_final_in_for_each: true
    avoid_setters_without_getters: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # API hygiene
    always_use_package_imports: true
    avoid_equals_and_hash_code_on_mutable_classes: true
    avoid_positional_boolean_parameters: true
    avoid_returning_this: true
    avoid_void_async: true
    only_throw_errors: true
    prefer_asserts_with_message: true
    use_enums: true
    use_super_parameters: true

    # Style
    combinators_ordering: true
    directives_ordering: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true
    require_trailing_commas: true
    unnecessary_parenthesis: true
    unnecessary_raw_strings: true
